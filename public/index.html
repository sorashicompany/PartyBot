<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#100c18" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>SorashiPartyFunBot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--ink:#100c18;--panel:#21182e;--panel-2:#171222;--line:#514064;--muted:#c8bdd5;--lime:#c5ff58;--coral:#ff6b73;--cream:#fff7e8}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 88% 0%,#51296d 0,transparent 42%),radial-gradient(ellipse at 0% 85%,#30204b 0,transparent 36%),var(--ink);color:var(--cream);font-family:Manrope,system-ui,sans-serif}
    main{width:min(100%,680px);min-height:100vh;margin:auto;padding:clamp(16px,4vw,30px);display:flex;flex-direction:column}
    header{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;font-weight:900;letter-spacing:.09em}
    header span{color:var(--lime)}.tag{font-size:9px;border:1px solid var(--line);border-radius:99px;padding:7px 10px;color:var(--muted);white-space:nowrap}
    section{margin:clamp(20px,5vh,36px) 0;padding:clamp(20px,5vw,30px);border:1px solid #665078;border-radius:26px;background:linear-gradient(145deg,rgba(45,32,62,.97),rgba(29,21,42,.97));box-shadow:0 24px 70px #08050d88}
    small{color:var(--lime);font-size:10px;font-weight:800;letter-spacing:.18em}
    h1{font-family:Unbounded,Manrope,sans-serif;font-size:clamp(34px,9vw,58px);line-height:1.02;letter-spacing:-.065em;margin:16px 0 20px}
    h1 em{color:var(--lime);font-style:normal}
    p{color:var(--muted);line-height:1.6}
    input,textarea{width:100%;padding:15px;margin:9px 0;background:var(--panel-2);border:1px solid #59476d;border-radius:14px;color:var(--cream);font:inherit;outline:none}
    input:focus,textarea:focus{border-color:var(--lime);box-shadow:0 0 0 3px #c5ff5820}
    #code{text-align:center;font-family:Unbounded,sans-serif;font-size:22px;letter-spacing:.35em;text-transform:uppercase}
    textarea{min-height:104px;resize:vertical;line-height:1.45}
    button{width:100%;min-height:50px;padding:14px 16px;border:1px solid #111;border-radius:14px;background:var(--lime);color:#171322;font:800 13px Manrope,sans-serif;letter-spacing:.025em;cursor:pointer;margin-top:9px;box-shadow:4px 4px 0 var(--cream);transition:transform .14s,box-shadow .14s}
    button:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 transparent}
    button.secondary{background:#4a365d;color:var(--cream);border-color:#6a547d;box-shadow:4px 4px 0 #0d0912}
    button:disabled{opacity:.4;cursor:default;box-shadow:none}
    #status{margin-top:14px;color:var(--muted);font-size:13px}.hidden{display:none!important}
    .prompt{font-size:clamp(19px,5vw,27px);font-weight:800;line-height:1.3;margin:15px 0}
    .player,.answer{background:var(--panel-2);border:1px solid #3e304e;border-radius:16px;padding:15px;margin:10px 0}
    .player{font-size:13px}.answer p{margin:0 0 8px;color:var(--cream);font-size:17px;font-weight:700;overflow-wrap:anywhere}
    .meta{font-size:10px;color:#a99bb7;letter-spacing:.08em;text-transform:uppercase}.score{float:right;color:var(--lime);font-weight:900}
    .answers{display:grid;gap:8px}.answers .answer{margin:0}
    #phaseTimer{font-family:Unbounded,sans-serif;font-size:17px;color:var(--lime);font-variant-numeric:tabular-nums}
    #gameStatus{margin-top:16px;color:#a99bb7}
    footer{text-align:center;color:#91849e;font-size:11px;padding:18px;margin-top:auto}
    @media(min-width:600px){.answers{grid-template-columns:1fr 1fr}.answers .answer:only-child{grid-column:1/-1}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body><main>
  <header><div>SORASHI<span>PARTY</span>FUNBOT</div><div class="tag">QUIPLASH · MVP</div></header>
  <section id="entry">
    <small>ТВОЯ КОМНАТА ЖДЁТ</small><h1>Время<br><em>играть.</em></h1>
    <p>Введи код из Telegram-группы, чтобы присоединиться к игре.</p>
    <input id="code" maxlength="5" placeholder="КОД" autocomplete="off" />
    <button id="join">ВОЙТИ В КОМНАТУ</button><div id="status"></div>
  </section>
  <section id="game" class="hidden">
    <small id="phase">КОМНАТА</small><h1 id="roundTitle">Раунд</h1>
    <div id="prompt" class="prompt"></div>
    <div id="players"></div>
    <div id="action"></div>
    <div id="answers" class="answers"></div>
    <div id="phaseTimer" class="prompt"></div><div id="gameStatus" class="meta"></div>
  </section>
  <footer>Одна комната. Много поводов смеяться.</footer>
</main>
<script>
  const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
  const params=new URLSearchParams(location.search);
  const input=document.querySelector('#code'),entry=document.querySelector('#entry'),game=document.querySelector('#game');
  const status=document.querySelector('#status'),action=document.querySelector('#action'),answersEl=document.querySelector('#answers');
  input.value=(tg?.initDataUnsafe?.start_param||params.get('room')||'').toUpperCase();
  let roomCode='',ticket='',socket=null,lastState=null;
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function api(path,body){
    const target=body?path:path+'?code='+encodeURIComponent(roomCode);
    const response=await fetch(target,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||''},...(body?{body:JSON.stringify({...body,code:roomCode})}:{})});
    const data=await response.json();if(!response.ok)throw new Error(data.error||'Ошибка запроса');return data;
  }
  async function join(){
    status.textContent='Подключаемся…';
    try{
      roomCode=input.value.trim().toUpperCase();
      const response=await fetch('/api/rooms/join',{method:'POST',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||''},body:JSON.stringify({code:roomCode})});
      const data=await response.json();if(!response.ok)throw new Error(data.error||'Не удалось войти');
      ticket=data.ticket;entry.classList.add('hidden');game.classList.remove('hidden');connect();await refresh();
    }catch(e){status.textContent=e.message||'Ошибка подключения';}
  }
  function connect(){
    if(socket)socket.close();
    socket=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/rooms/'+roomCode+'?ticket='+encodeURIComponent(ticket));
    socket.onmessage=()=>refresh().catch(()=>{});
    socket.onclose=()=>{setTimeout(()=>{if(ticket)connect()},2500)};
  }
  async function refresh(){
    if(!roomCode)return;
    const s=await api('/api/game/state');lastState=s;if(document.activeElement?.tagName==='TEXTAREA')return;render(s);
  }
  function render(s){
    document.querySelector('#phase').textContent='КОМНАТА '+s.code+' · '+s.status.toUpperCase();
    document.querySelector('#roundTitle').innerHTML=s.status==='finished'?'Игра<br><em>окончена.</em>':'Раунд '+s.round+'<br><em>Quiplash.</em>';
    document.querySelector('#prompt').textContent='';
    document.querySelector('#players').innerHTML=s.players.map(p=>'<div class="player">'+esc(p.name)+(p.isHost?' · ведущий':'')+'<span class="score">'+p.score+'</span></div>').join('');
    action.innerHTML='';answersEl.innerHTML='';
    if(s.status==='lobby'){
      action.innerHTML=s.isHost?'<label><input id="customToggle" type="checkbox" style="width:auto;letter-spacing:0" '+(s.customPromptsEnabled?'checked':'')+'> Использовать мои вопросы</label><p>После старта каждый игрок введёт два вопроса за 2 минуты.</p><button id="start">НАЧАТЬ ИГРУ</button>':'<p>Ожидаем ведущего. Для старта нужно 4–10 игроков.</p>'; 
      document.querySelector('#customToggle')?.addEventListener('change',e=>runAction('/api/game/settings',{customEnabled:e.target.checked}));
      
      document.querySelector('#start')?.addEventListener('click',()=>runAction('/api/game/start',{}));
    }else if(s.status==='custom_writing'){
      action.innerHTML='<p>Каждый игрок должен придумать два вопроса. На это есть 2 минуты.</p><textarea id="customOne" maxlength="240" placeholder="Первый вопрос (5–240 символов)"></textarea><textarea id="customTwo" maxlength="240" placeholder="Второй вопрос (5–240 символов)"></textarea><p>Отправлено: '+s.customPromptCount+' из 2</p><button id="submitCustom" '+(s.customPromptCount>=2?'disabled':'')+'>ОТПРАВИТЬ ДВА ВОПРОСА</button>';document.querySelector('#submitCustom')?.addEventListener('click',()=>runAction('/api/game/custom-prompts',{prompts:[document.querySelector('#customOne').value,document.querySelector('#customTwo').value]}));
    }else if(s.status==='answering'){
      const cards=(s.prompts||[]).map(p=>'<div class="answer"><div class="meta">ВОПРОС '+(p.slot||1)+' ИЗ '+(s.round===3?1:2)+'</div><p>'+esc(p.text)+'</p><textarea maxlength="240" data-answer="'+p.assignmentId+'" placeholder="напиши ответ строчными буквами…"></textarea><button data-submit="'+p.assignmentId+'">ОТПРАВИТЬ</button></div>').join('');
      action.innerHTML=cards+(s.round===3?'<div class="answer"><label>Ставка финального раунда</label><input id="wager" type="number" min="0" max="10000" value="0" /></div>':'');
      action.querySelectorAll('[data-answer]').forEach(t=>t.addEventListener('input',()=>{const pos=t.selectionStart;t.value=t.value.toLocaleLowerCase('ru-RU');t.setSelectionRange(pos,pos)}));
      action.querySelectorAll('[data-submit]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.submit;const field=action.querySelector('[data-answer="'+id+'"]');runAction('/api/game/answer',{assignmentId:id,text:field.value,wager:Number(document.querySelector('#wager')?.value||0)})}));
    }else if(['voting','round_results','finished'].includes(s.status)){
      if(s.status==='round_results'||s.status==='finished'){answersEl.innerHTML=(s.answers||[]).map(a=>'<div class="answer"><div class="meta">'+esc(s.promptLabels?.[a.promptId]||'')+'</div><p>'+esc(a.text)+'</p><div class="meta">'+esc(a.name||'Игрок')+' · '+a.votes+' голосов</div></div>').join('');}else{const pid=s.activeVotingPromptId;const current=(s.answers||[]).filter(a=>a.promptId===pid);answersEl.innerHTML=pid?'<div class="answer"><div class="meta">ВОПРОС '+esc(s.promptLabels?.[pid]||'')+'</div>'+current.map(a=>'<div class="answer"><p>'+esc(a.text)+'</p><div class="meta">Анонимный ответ</div>'+(s.status==='voting'&&!current.some(x=>x.own)&&!a.voted?'<button class="secondary" data-vote="'+a.id+'">ВЫБРАТЬ ЭТОТ ОТВЕТ</button>':'')+'</div>').join('')+'</div>':'';}
      answersEl.querySelectorAll('[data-vote]').forEach(b=>b.addEventListener('click',()=>runAction('/api/game/vote',{answerId:b.dataset.vote})));
      if(s.status==='voting')action.innerHTML='<p>Выбери один из двух ответов. Следующий вопрос появится автоматически.</p>';
      if(s.status==='round_results')action.innerHTML=s.isHost?'<button id="next">СЛЕДУЮЩИЙ РАУНД</button>':'<p>Раунд завершён. Ждём ведущего.</p>';
      if(s.status==='finished')action.innerHTML='<p>Игра завершена. Итоговый счёт показан выше.</p>';
      document.querySelector('#next')?.addEventListener('click',()=>runAction('/api/game/next',{}));
    }
    document.querySelector('#gameStatus').textContent='Игроков: '+s.players.length+' · Раунд '+s.round+' из 3';
    const timer=document.querySelector('#phaseTimer');
    if(s.deadline){const left=Math.max(0,Math.ceil((Date.parse(s.deadline)-Date.now())/1000));timer.textContent='Осталось: '+left+' сек.';}else timer.textContent='';
  }
  setInterval(()=>{if(lastState?.deadline){const left=Math.max(0,Math.ceil((Date.parse(lastState.deadline)-Date.now())/1000));document.querySelector("#phaseTimer").textContent="Осталось: "+left+" сек.";}},1000);
  setInterval(()=>{if(roomCode)refresh().catch(()=>{})},2000);
  async function runAction(path,body){try{await api(path,body);await refresh()}catch(e){alert(e.message)}}
  document.querySelector('#join').addEventListener('click',join);
  if(input.value)join();
</script></body></html>
