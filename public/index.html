<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#120e20" />
  <title>SorashiPartyFunBot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 10%,#4a2368,transparent 38%),#120e20;color:#fff;font-family:system-ui,sans-serif}
    main{max-width:560px;min-height:100vh;margin:auto;padding:24px;display:flex;flex-direction:column}
    header{display:flex;justify-content:space-between;align-items:center;font-weight:900;letter-spacing:1px}
    header span{color:#c5ff58}.tag{font-size:10px;border:1px solid #5d4b72;border-radius:30px;padding:7px 10px;color:#c8bdd5}
    section{margin:auto 0;padding:26px;border:1px solid #55416c;border-radius:24px;background:#241a34}
    small{color:#c5ff58;font-weight:800;letter-spacing:2px}h1{font-size:clamp(46px,12vw,70px);line-height:.95;letter-spacing:-3px;margin:16px 0}h1 em{color:#c5ff58;font-style:normal}
    p{color:#c8bdd5;line-height:1.6}input{width:100%;padding:17px;margin:12px 0;background:#171222;border:1px solid #5b4a70;border-radius:12px;color:white;text-align:center;font-size:22px;letter-spacing:8px}
    button{width:100%;padding:17px;border:0;border-radius:12px;background:#c5ff58;color:#171322;font-weight:900;cursor:pointer}
    #status{margin-top:15px;color:#c8bdd5;font-size:13px}.players{display:grid;gap:8px;margin:16px 0}.player{background:#171222;border-radius:10px;padding:12px}
    footer{text-align:center;color:#91849e;font-size:11px;padding:20px}
  </style>
</head>
<body><main>
  <header><div>SORASHI<span>PARTY</span>FUNBOT</div><div class="tag">QUIPLASH · MVP</div></header>
  <section>
    <small>ТВОЯ КОМНАТА ЖДЁТ</small>
    <h1>Время<br><em>играть.</em></h1>
    <p>Введи код из Telegram-группы, чтобы присоединиться к игре.</p>
    <input id="code" maxlength="5" placeholder="КОД" autocomplete="off" />
    <button id="join">ВОЙТИ В КОМНАТУ</button>
    <div id="status"></div>
  </section>
  <footer>Одна комната. Много поводов смеяться.</footer>
</main>
<script>
  const tg = window.Telegram?.WebApp; tg?.ready(); tg?.expand();
  const params = new URLSearchParams(location.search);
  const input = document.querySelector('#code');
  input.value = (tg?.initDataUnsafe?.start_param || params.get('room') || '').toUpperCase();
  const status = document.querySelector('#status');
  document.querySelector('#join').addEventListener('click', async () => {
    status.textContent = 'Подключаемся…';
    try {
      const response = await fetch('/api/rooms/join', {
        method:'POST', headers:{'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData || ''},
        body:JSON.stringify({code:input.value.trim().toUpperCase()})
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Не удалось войти');
      status.textContent = 'Ты в комнате ' + data.code + '. Ожидаем остальных игроков.';
    } catch (e) { status.textContent = e.message || 'Ошибка подключения'; }
  });
</script></body></html>
