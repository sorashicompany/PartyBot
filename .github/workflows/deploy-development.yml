name: deploy-development

on:
  push:
    branches: [feature/spectator-voting-bonus]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT_TOKEN: ${{ secrets.DEV_BOT_TOKEN }}
      BOT_USERNAME: ${{ secrets.DEV_BOT_USERNAME }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.DEV_TELEGRAM_WEBHOOK_SECRET }}
      ROOM_TICKET_SECRET: ${{ secrets.DEV_ROOM_TICKET_SECRET }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - name: Check deployment secrets
        id: check
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BOT_TOKEN BOT_USERNAME TELEGRAM_WEBHOOK_SECRET ROOM_TICKET_SECRET SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then echo "Missing GitHub Actions secret: $name"; missing=1; fi
          done
          if [ "$missing" -eq 0 ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi
      - name: Upload development secrets
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "$BOT_TOKEN" | npx wrangler secret put BOT_TOKEN --config wrangler.dev.jsonc
          printf '%s' "$BOT_USERNAME" | npx wrangler secret put BOT_USERNAME --config wrangler.dev.jsonc
          printf '%s' "$TELEGRAM_WEBHOOK_SECRET" | sha256sum | cut -d ' ' -f1 | npx wrangler secret put TELEGRAM_WEBHOOK_SECRET --config wrangler.dev.jsonc
          printf '%s' "$ROOM_TICKET_SECRET" | npx wrangler secret put ROOM_TICKET_SECRET --config wrangler.dev.jsonc
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --config wrangler.dev.jsonc
      - name: Deploy isolated development Worker
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.dev.jsonc
      - name: Configure the separate Telegram test bot
        if: steps.check.outputs.ready == 'true'
        env:
          TELEGRAM_SECRET_HASH: ${{ env.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          const token = process.env.BOT_TOKEN;
          const secret = createHash("sha256").update(process.env.TELEGRAM_WEBHOOK_SECRET).digest("hex");
          const call = async (method, body) => {
            const response = await fetch(`https://api.telegram.org/bot${token}/${method}`, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify(body)
            });
            const data = await response.json();
            if (!data.ok) throw new Error(`Telegram ${method} failed: ${data.description || response.status}`);
          };
          await call("setWebhook", {
            url: "https://sorashi-party-fun-bot-dev.sorashithegod.workers.dev/telegram/webhook",
            secret_token: secret,
            allowed_updates: ["message", "callback_query"]
          });
          await call("setMyCommands", {
            commands: [{ command: "party", description: "Создать тестовую комнату" }]
          });
          NODE
      - name: Verify development Worker health
        if: steps.check.outputs.ready == 'true'
        run: |
          curl --fail --silent --show-error https://sorashi-party-fun-bot-dev.sorashithegod.workers.dev/health
